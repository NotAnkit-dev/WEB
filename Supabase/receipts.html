<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Book (OCR & CSV)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            color: #f8fafc;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-bar h2 {
            margin: 0;
            color: #f59e0b;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        .upload-section {
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            background: #0f172a;
        }
        .preview-img {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
        }
        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .action-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .csv-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 160px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        .status-msg {
            font-size: 14px;
            margin-top: 8px;
            color: #38bdf8;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>🧾 Receipt Book Scanner</h2>
            <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <div class="upload-section">
            <input type="file" id="receipt-input" accept="image/*">
            <br>
            <img id="receipt-preview" class="preview-img" alt="Receipt preview">
        </div>

        <div class="action-row">
            <button id="scan-btn" class="action-btn" disabled>Scan with OCR</button>
            <button id="export-csv-btn" class="csv-btn">Export Text to CSV</button>
        </div>

        <div id="ocr-status" class="status-msg"></div>

        <h4 style="margin: 15px 0 8px 0;">Extracted Receipt Data:</h4>
        <textarea id="ocr-result" placeholder="OCR text output will appear here..."></textarea>
    </div>

    <script>
        const fileInput = document.getElementById('receipt-input');
        const preview = document.getElementById('receipt-preview');
        const scanBtn = document.getElementById('scan-btn');
        const statusEl = document.getElementById('ocr-status');
        const resultArea = document.getElementById('ocr-result');
        const exportBtn = document.getElementById('export-csv-btn');

        let activeFile = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                activeFile = file;
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'inline-block';
                scanBtn.disabled = false;
                statusEl.innerText = '';
            }
        });

        scanBtn.addEventListener('click', async () => {
            if (!activeFile) return;

            scanBtn.disabled = true;
            statusEl.innerText = 'Initializing OCR reader...';

            try {
                const { data: { text } } = await Tesseract.recognize(
                    activeFile,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                statusEl.innerText = `Scanning: ${Math.round(m.progress * 100)}%`;
                            }
                        }
                    }
                );

                statusEl.innerText = 'Scan completed successfully!';
                resultArea.value = text;
            } catch (err) {
                console.error(err);
                statusEl.innerText = 'Failed to process receipt image.';
            } finally {
                scanBtn.disabled = false;
            }
        });

        exportBtn.addEventListener('click', () => {
            const text = resultArea.value.trim();
            if (!text) {
                alert('No text to export! Scan or type some content first.');
                return;
            }

            const rows = text.split('\n').map(line => `"${line.replace(/"/g, '""')}"`);
            const csvContent = 'data:text/csv;charset=utf-8,Line Item\n' + rows.join('\n');
            const encodedUri = encodeURI(csvContent);

            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `receipt_export_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
