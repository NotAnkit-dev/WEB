<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Book OCR - Community Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tesseract.js for in-browser OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-amber-dark: #d97706;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
        }

        .top-nav h2 {
            font-size: 20px;
            color: var(--accent-amber);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: linear-gradient(135deg, #7dd3fc, #0284c7);
            color: white;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            transform: scale(1.03);
        }

        /* Top Split: Manual Left, Image Right */
        .split-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .split-section {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card h3 {
            font-size: 16px;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        /* Form elements */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-amber);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-amber-dark));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        .primary-btn:hover {
            opacity: 0.92;
        }

        /* Image & OCR Area */
        .upload-box {
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background: #0f172a;
        }

        .preview-img-container {
            width: 100%;
            height: 240px;
            background: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
        }

        .preview-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .ocr-status {
            font-size: 13px;
            color: var(--accent-blue);
            min-height: 18px;
            text-align: center;
        }

        /* Bottom Table Section */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .action-del-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-del-btn:hover {
            background: rgba(239, 68, 68, 0.35);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navbar -->
        <div class="top-nav">
            <h2>🧾 Receipt Book OCR System</h2>
            <a href="dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>
        </div>

        <!-- Upper Section: Form (Left) & Image / Scan (Right) -->
        <div class="split-section">
            
            <!-- Manual / Captured Form -->
            <div class="card">
                <h3>📝 Receipt Information</h3>
                <form id="receipt-form">
                    <div class="form-group">
                        <label>1. Recipient / Donor Name</label>
                        <input type="text" id="rcpt-name" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <label>2. Date</label>
                        <input type="date" id="rcpt-date" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>3. Amount (In Numbers)</label>
                            <input type="number" step="any" id="rcpt-amount-num" placeholder="e.g. 5000" required>
                        </div>

                        <div class="form-group">
                            <label>5. Category</label>
                            <select id="rcpt-category" required>
                                <option value="Building fund">Building fund</option>
                                <option value="Namaskar">Namaskar</option>
                                <option value="Sadharan">Sadharan</option>
                                <option value="General Donation">General Donation</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>4. Amount Written in Words</label>
                        <input type="text" id="rcpt-amount-words" placeholder="e.g. Five Thousand Only" required>
                    </div>

                    <button type="submit" class="primary-btn">💾 Save to Record Table</button>
                </form>
            </div>

            <!-- OCR Scanner Side -->
            <div class="card">
                <h3>📷 Receipt Image & OCR Extraction</h3>
                <div class="upload-box">
                    <input type="file" id="image-upload" accept="image/*">
                </div>

                <div class="preview-img-container">
                    <span id="preview-placeholder" style="color: var(--text-muted); font-size: 13px;">No receipt image chosen</span>
                    <img id="receipt-img" alt="Receipt preview">
                </div>

                <button type="button" id="start-ocr-btn" class="primary-btn" style="background: linear-gradient(135deg, #0284c7, #0ea5e9);" disabled>
                    🔍 Run OCR Extraction
                </button>
                <div id="ocr-progress" class="ocr-status"></div>
            </div>

        </div>

        <!-- Bottom Section: Records Table -->
        <div class="table-card">
            <div class="table-header">
                <h3 style="color: var(--accent-amber); border: none; margin: 0;">📊 Stored Receipt Records</h3>
                <button type="button" id="export-csv-btn" class="primary-btn" style="padding: 7px 14px; font-size: 13px; margin: 0; background: linear-gradient(135deg, #10b981, #059669);">
                    📥 Export CSV
                </button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Date</th>
                            <th>Amount (₹ / $)</th>
                            <th>Amount (In Words)</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-tbody">
                        <!-- Dynamic Records -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const receiptImg = document.getElementById('receipt-img');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const startOcrBtn = document.getElementById('start-ocr-btn');
        const ocrProgress = document.getElementById('ocr-progress');
        const receiptForm = document.getElementById('receipt-form');
        const recordsTbody = document.getElementById('records-tbody');
        const exportCsvBtn = document.getElementById('export-csv-btn');

        let selectedFile = null;
        let storedReceipts = JSON.parse(localStorage.getItem('community_receipt_records')) || [];

        // Render saved entries on page load
        renderTable();

        // Handle Image Selection
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                receiptImg.src = URL.createObjectURL(file);
                receiptImg.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                startOcrBtn.disabled = false;
                ocrProgress.innerText = 'Ready to scan.';
            }
        });

        // Run Tesseract OCR and extract 5 parameters
        startOcrBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            startOcrBtn.disabled = true;
            ocrProgress.innerText = 'Initializing OCR engine...';

            try {
                const { data: { text } } = await Tesseract.recognize(
                    selectedFile,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                ocrProgress.innerText = `Extracting: ${Math.round(m.progress * 100)}%`;
                            }
                        }
                    }
                );

                ocrProgress.innerText = 'Scan finished! Parsing fields...';
                parseReceiptText(text);
            } catch (err) {
                console.error(err);
                ocrProgress.innerText = 'Error reading the receipt image.';
            } finally {
                startOcrBtn.disabled = false;
            }
        });

        // Parse OCR text using regex patterns
        function parseReceiptText(rawText) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);

            // 1. Detect Category keywords
            const lower = rawText.toLowerCase();
            if (lower.includes('building') || lower.includes('fund')) {
                document.getElementById('rcpt-category').value = 'Building fund';
            } else if (lower.includes('namaskar')) {
                document.getElementById('rcpt-category').value = 'Namaskar';
            } else if (lower.includes('sadharan')) {
                document.getElementById('rcpt-category').value = 'Sadharan';
            }

            // 2. Extract Numbers (Amounts)
            const numberMatches = rawText.match(/(?:(?:rs\.?|inr|\$)\s*)?([0-9]+(?:,[0-9]+)*(?:\.[0-9]{2})?)/gi);
            if (numberMatches) {
                const cleanNums = numberMatches
                    .map(n => n.replace(/[^0-9.]/g, ''))
                    .filter(n => parseFloat(n) > 0);
                if (cleanNums.length > 0) {
                    document.getElementById('rcpt-amount-num').value = cleanNums[cleanNums.length - 1];
                }
            }

            // 3. Extract Dates (DD/MM/YYYY or YYYY-MM-DD formats)
            const dateMatch = rawText.match(/\b(\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{4}[/-]\d{1,2}[/-]\d{1,2})\b/);
            if (dateMatch) {
                const parsedDate = new Date(dateMatch[0]);
                if (!isNaN(parsedDate.getTime())) {
                    document.getElementById('rcpt-date').value = parsedDate.toISOString().split('T')[0];
                }
            }

            // 4. Look for "Rupees in words" or "Sum of"
            const wordsMatch = rawText.match(/(?:rupees|sum of|amount of)\s*([a-zA-Z\s]+)(?:only|\.)?/i);
            if (wordsMatch && wordsMatch[1]) {
                document.getElementById('rcpt-amount-words').value = wordsMatch[1].trim();
            }

            // 5. Look for Name indicators
            const nameMatch = rawText.match(/(?:received from|name|mr\.|mrs\.|shri)\s*:?\s*([a-zA-Z\s]+)/i);
            if (nameMatch && nameMatch[1]) {
                document.getElementById('rcpt-name').value = nameMatch[1].split('\n')[0].trim();
            }

            ocrProgress.innerText = 'Fields auto-filled. Please review and click Save.';
        }

        // Save Form Data to Local Storage and Table
        receiptForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const record = {
                id: Date.now(),
                name: document.getElementById('rcpt-name').value.trim(),
                date: document.getElementById('rcpt-date').value,
                amountNum: document.getElementById('rcpt-amount-num').value.trim(),
                amountWords: document.getElementById('rcpt-amount-words').value.trim(),
                category: document.getElementById('rcpt-category').value
            };

            storedReceipts.push(record);
            localStorage.setItem('community_receipt_records', JSON.stringify(storedReceipts));
            renderTable();

            receiptForm.reset();
            ocrProgress.innerText = 'Record saved successfully!';
        });

        // Render Table Rows
        function renderTable() {
            recordsTbody.innerHTML = '';

            if (storedReceipts.length === 0) {
                recordsTbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No records saved yet.</td></tr>`;
                return;
            }

            storedReceipts.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.date}</td>
                    <td>${item.amountNum}</td>
                    <td>${item.amountWords}</td>
                    <td><span class="badge">${item.category}</span></td>
                    <td><button class="action-del-btn" onclick="deleteRecord(${item.id})">Delete</button></td>
                `;
                recordsTbody.appendChild(tr);
            });
        }

        // Delete Row
        window.deleteRecord = function(id) {
            storedReceipts = storedReceipts.filter(r => r.id !== id);
            localStorage.setItem('community_receipt_records', JSON.stringify(storedReceipts));
            renderTable();
        };

        // Export to CSV
        exportCsvBtn.addEventListener('click', () => {
            if (storedReceipts.length === 0) {
                alert('No receipt records available to export.');
                return;
            }

            const headers = ['Name', 'Date', 'Amount (Numbers)', 'Amount (Words)', 'Category'];
            const rows = storedReceipts.map(r => [
                `"${r.name.replace(/"/g, '""')}"`,
                `"${r.date}"`,
                `"${r.amountNum}"`,
                `"${r.amountWords.replace(/"/g, '""')}"`,
                `"${r.category}"`
            ]);

            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `receipt_book_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
