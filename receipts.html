<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Book Account Management</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            color: #38bdf8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card h2 {
            font-size: 18px;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, select, textarea {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-edit {
            background: #eab308;
            color: #0f172a;
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: #10b981;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: #64748b;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #38bdf8;
            transition: width 0.2s ease;
        }

        #image-preview {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px dashed #475569;
            display: none;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #334155;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            vertical-align: middle;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #273549;
        }

        .status-badge {
            font-size: 12px;
            color: #38bdf8;
        }

        .action-cell-btns {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .table-edit-input {
            width: 100%;
            padding: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Receipt Book Management</h1>
                <p style="font-size: 14px; color: #94a3b8;">Scan paper receipts with OCR and record accounts</p>
            </div>
            
            <!-- TOP BAR: Import CSV, Export CSV, and Back Navigation -->
            <div class="header-actions">
                <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
                <button id="import-csv-btn" class="btn" style="background: linear-gradient(135deg, #10b981, #059669);">📥 Import CSV</button>
                <button id="export-btn" class="btn btn-secondary">Export to CSV</button>
                <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary" style="background: #475569;">Back</button>
                <span id="import-status" style="font-size: 12px; color: #38bdf8; width: 100%; text-align: right;"></span>
            </div>
        </header>

        <div class="layout-grid">
            <!-- Left Card: Capture & OCR Scan -->
            <div class="card">
                <h2>1. Upload / Capture Receipt</h2>
                
                <div class="form-group">
                    <label>Choose File or Take Photo:</label>
                    <input type="file" id="receipt-file" accept="image/*" capture="environment">
                </div>

                <img id="image-preview" alt="Preview of receipt">

                <button id="scan-btn" class="btn" disabled>Scan Receipt Text</button>

                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="scan-status" class="status-badge"></span>

                <div class="form-group">
                    <label>Raw Extracted OCR Text:</label>
                    <textarea id="raw-ocr" rows="4" placeholder="Extracted text will appear here..." readonly></textarea>
                </div>
            </div>

            <!-- Right Card: Form Verification & Entry -->
            <div class="card">
                <h2>2. Verify & Save Account Entry</h2>
                
                <form id="receipt-form" style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="form-group">
                        <label>Receipt No. *</label>
                        <input type="text" id="receipt-no" placeholder="e.g. REC-1042" required>
                    </div>

                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="receipt-date" required>
                    </div>

                    <div class="form-group">
                        <label>Contributor / Payer Name *</label>
                        <input type="text" id="payer-name" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <label>Amount (₹ / $) *</label>
                        <input type="number" step="0.01" id="receipt-amount" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label>Payment Mode</label>
                        <select id="payment-mode">
                            <option value="Cash">Cash</option>
                            <option value="UPI / Online">UPI / Online</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Purpose / Category</label>
                        <input type="text" id="receipt-purpose" placeholder="e.g. Donation, Sewa, Fee">
                    </div>

                    <button type="submit" class="btn" style="margin-top: 8px;">Save to Account Ledger</button>
                </form>
            </div>
        </div>

        <!-- Bottom Card: Account Ledger / Database Table -->
        <div class="card">
            <div class="table-controls">
                <h2>3. Account Ledger Table</h2>
                <input type="text" id="search-input" placeholder="Search entries..." style="width: 260px;">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 15%;">Rec. #</th>
                            <th style="width: 14%;">Date</th>
                            <th style="width: 20%;">Name</th>
                            <th style="width: 13%;">Amount</th>
                            <th style="width: 14%;">Mode</th>
                            <th style="width: 12%;">Purpose</th>
                            <th style="width: 12%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows rendered via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let receiptsData = JSON.parse(localStorage.getItem('receipt_records')) || [];
        let currentlyEditingId = null;

        const fileInput = document.getElementById('receipt-file');
        const scanBtn = document.getElementById('scan-btn');
        const preview = document.getElementById('image-preview');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const scanStatus = document.getElementById('scan-status');
        const rawOcr = document.getElementById('raw-ocr');

        // Form fields
        const receiptNoInput = document.getElementById('receipt-no');
        const receiptDateInput = document.getElementById('receipt-date');
        const payerNameInput = document.getElementById('payer-name');
        const amountInput = document.getElementById('receipt-amount');
        const modeInput = document.getElementById('payment-mode');
        const purposeInput = document.getElementById('receipt-purpose');

        // CSV Elements
        const csvFileInput = document.getElementById('csv-file-input');
        const importCsvBtn = document.getElementById('import-csv-btn');
        const importStatus = document.getElementById('import-status');

        // File selection preview
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                scanBtn.disabled = false;
                scanStatus.innerText = 'Ready to scan.';
            } else {
                preview.style.display = 'none';
                scanBtn.disabled = true;
            }
        });

        // OCR recognition
        scanBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            scanBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            scanStatus.innerText = 'Initializing OCR engine...';

            try {
                const result = await Tesseract.recognize(
                    file,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                const pct = Math.round(m.progress * 100);
                                progressFill.style.width = pct + '%';
                                scanStatus.innerText = `Scanning: ${pct}%`;
                            }
                        }
                    }
                );

                const text = result.data.text;
                rawOcr.value = text;
                scanStatus.innerText = 'Scan completed! Auto-filling detected fields...';
                parseReceiptText(text);

            } catch (err) {
                console.error(err);
                scanStatus.innerText = 'Failed to read image. Please ensure good lighting and contrast.';
            } finally {
                scanBtn.disabled = false;
            }
        });

        // Text parser for receipt patterns
        function parseReceiptText(text) {
            // Amount
            const amountRegex = /(?:total|amount|rs\.?|inr|\$)\s*[:.-]?\s*([0-9]+(?:[\.,][0-9]{2})?)/i;
            const amountMatch = text.match(amountRegex);
            if (amountMatch) {
                amountInput.value = amountMatch[1].replace(',', '.');
            }

            // Receipt Number
            const receiptNoRegex = /(?:receipt|rec|no|voucher)\s*[:.#-]?\s*([a-zA-Z0-9\/-]+)/i;
            const recMatch = text.match(receiptNoRegex);
            if (recMatch) {
                receiptNoInput.value = recMatch[1];
            }

            // Date
            const dateRegex = /\b(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})\b/;
            const dateMatch = text.match(dateRegex);
            if (dateMatch) {
                const parts = dateMatch[0].replace(/[\/.]/g, '-').split('-');
                if (parts[0].length === 4) {
                    receiptDateInput.value = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                } else if (parts[2].length === 4) {
                    receiptDateInput.value = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            } else {
                receiptDateInput.value = new Date().toISOString().split('T')[0];
            }

            // Name
            const nameRegex = /(?:received from|name|mr\.|mrs\.|shri)\s*[:.-]?\s*([a-zA-Z\s]+)/i;
            const nameMatch = text.match(nameRegex);
            if (nameMatch) {
                payerNameInput.value = nameMatch[1].slice(0, 30).trim();
            }
        }

        // Form submission
        document.getElementById('receipt-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const newEntry = {
                id: Date.now(),
                receiptNo: receiptNoInput.value.trim(),
                date: receiptDateInput.value,
                name: payerNameInput.value.trim(),
                amount: parseFloat(amountInput.value).toFixed(2),
                mode: modeInput.value,
                purpose: purposeInput.value.trim() || '-'
            };

            receiptsData.unshift(newEntry);
            saveAndRender();

            // Clear inputs
            e.target.reset();
            rawOcr.value = '';
            preview.style.display = 'none';
            progressBar.style.display = 'none';
            scanStatus.innerText = '';
            fileInput.value = '';
            scanBtn.disabled = true;

            alert('Receipt entry successfully recorded!');
        });

        // ================= IMPORT CSV FUNCTIONALITY (AT TOP) =================
        importCsvBtn.addEventListener('click', () => {
            csvFileInput.click();
        });

        csvFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            importStatus.innerText = 'Parsing CSV file...';
            const reader = new FileReader();

            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

                if (lines.length <= 1) {
                    importStatus.innerText = 'File contains no data rows.';
                    return;
                }

                const imported = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                    if (cols.length >= 3) {
                        imported.push({
                            id: Date.now() + i,
                            receiptNo: cols[0] || `REC-${Date.now() + i}`,
                            date: cols[1] || new Date().toISOString().split('T')[0],
                            name: cols[2] || 'Imported Entry',
                            amount: cols[3] ? parseFloat(cols[3]).toFixed(2) : '0.00',
                            mode: cols[4] || 'Cash',
                            purpose: cols[5] || '-'
                        });
                    }
                }

                receiptsData = [...imported, ...receiptsData];
                saveAndRender();
                importStatus.innerText = `Successfully imported ${imported.length} records!`;
                csvFileInput.value = '';
            };

            reader.readAsText(file);
        });

        // Save & Render Table
        function saveAndRender() {
            localStorage.setItem('receipt_records', JSON.stringify(receiptsData));
            renderTable(receiptsData);
        }

        // Render Table with Beside Edit and Delete Buttons
        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b;">No receipt records saved yet.</td></tr>`;
                return;
            }

            data.forEach((item) => {
                const tr = document.createElement('tr');

                if (currentlyEditingId === item.id) {
                    // Inline Edit Mode
                    tr.innerHTML = `
                        <td><input type="text" id="edit-no-${item.id}" value="${item.receiptNo}" class="table-edit-input"></td>
                        <td><input type="date" id="edit-date-${item.id}" value="${item.date}" class="table-edit-input"></td>
                        <td><input type="text" id="edit-name-${item.id}" value="${item.name}" class="table-edit-input"></td>
                        <td><input type="number" step="0.01" id="edit-amount-${item.id}" value="${item.amount}" class="table-edit-input"></td>
                        <td>
                            <select id="edit-mode-${item.id}" class="table-edit-input">
                                <option value="Cash" ${item.mode === 'Cash' ? 'selected' : ''}>Cash</option>
                                <option value="UPI / Online" ${item.mode === 'UPI / Online' ? 'selected' : ''}>UPI / Online</option>
                                <option value="Cheque" ${item.mode === 'Cheque' ? 'selected' : ''}>Cheque</option>
                                <option value="Bank Transfer" ${item.mode === 'Bank Transfer' ? 'selected' : ''}>Bank Transfer</option>
                            </select>
                        </td>
                        <td><input type="text" id="edit-purpose-${item.id}" value="${item.purpose}" class="table-edit-input"></td>
                        <td>
                            <div class="action-cell-btns">
                                <button class="btn-save" onclick="saveEdit(${item.id})">Save</button>
                                <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                            </div>
                        </td>
                    `;
                } else {
                    // Normal Display Mode with Edit beside Delete
                    tr.innerHTML = `
                        <td style="font-weight: 600; color: #38bdf8;">${item.receiptNo}</td>
                        <td>${item.date}</td>
                        <td>${item.name}</td>
                        <td>₹ ${item.amount}</td>
                        <td>${item.mode}</td>
                        <td>${item.purpose}</td>
                        <td>
                            <div class="action-cell-btns">
                                <button class="btn-edit" onclick="startEdit(${item.id})">Edit</button>
                                <button class="btn-danger" onclick="deleteEntry(${item.id})">Delete</button>
                            </div>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });
        }

        // Inline Edit Handlers
        window.startEdit = function(id) {
            currentlyEditingId = id;
            renderTable(receiptsData);
        };

        window.cancelEdit = function() {
            currentlyEditingId = null;
            renderTable(receiptsData);
        };

        window.saveEdit = function(id) {
            const updatedNo = document.getElementById(`edit-no-${id}`).value.trim();
            const updatedDate = document.getElementById(`edit-date-${id}`).value;
            const updatedName = document.getElementById(`edit-name-${id}`).value.trim();
            const updatedAmount = parseFloat(document.getElementById(`edit-amount-${id}`).value || 0).toFixed(2);
            const updatedMode = document.getElementById(`edit-mode-${id}`).value;
            const updatedPurpose = document.getElementById(`edit-purpose-${id}`).value.trim() || '-';

            if (!updatedNo || !updatedName) {
                alert('Receipt No. and Name cannot be empty.');
                return;
            }

            receiptsData = receiptsData.map(item => {
                if (item.id === id) {
                    return {
                        ...item,
                        receiptNo: updatedNo,
                        date: updatedDate,
                        name: updatedName,
                        amount: updatedAmount,
                        mode: updatedMode,
                        purpose: updatedPurpose
                    };
                }
                return item;
            });

            currentlyEditingId = null;
            saveAndRender();
        };

        // Delete Row
        window.deleteEntry = function(id) {
            if (confirm('Delete this receipt entry?')) {
                receiptsData = receiptsData.filter(item => item.id !== id);
                saveAndRender();
            }
        };

        // Search filter
        document.getElementById('search-input').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = receiptsData.filter(item => 
                item.receiptNo.toLowerCase().includes(q) ||
                item.name.toLowerCase().includes(q) ||
                item.purpose.toLowerCase().includes(q) ||
                item.mode.toLowerCase().includes(q)
            );
            renderTable(filtered);
        });

        // Export to CSV
        document.getElementById('export-btn').addEventListener('click', () => {
            if (receiptsData.length === 0) {
                alert('No data to export.');
                return;
            }

            const headers = ['Receipt No', 'Date', 'Name', 'Amount', 'Payment Mode', 'Purpose'];
            const rows = receiptsData.map(r => [
                `"${r.receiptNo}"`,
                `"${r.date}"`,
                `"${r.name}"`,
                `"${r.amount}"`,
                `"${r.mode}"`,
                `"${r.purpose}"`
            ]);

            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `receipt_ledger_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Initialize table
        renderTable(receiptsData);
    </script>
</body>
</html>
