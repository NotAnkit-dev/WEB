<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Portal - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-background">
        <div class="login-card" style="width: 380px; gap: 16px; text-align: center;">
            <h2 style="font-size: 24px; color: #38bdf8;">Community Portal 🛡️</h2>
            <p style="font-size: 14px; color: #94a3b8; margin-top: -6px;">Enter credentials to access dashboard</p>

            <form id="login-form" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="login-email" style="font-size: 13px; color: #cbd5e1;">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required style="padding: 12px; font-size: 14px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="login-password" style="font-size: 13px; color: #cbd5e1;">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required style="padding: 12px; font-size: 14px;">
                </div>

                <button type="submit" id="submit-btn" class="sign-in-btn" style="padding: 14px; font-size: 15px; margin-top: 6px;">Sign In</button>
            </form>

            <p id="error-message" style="font-size: 13px; color: #ef4444; min-height: 18px; margin: 0;"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://omwsgrsctlqrsdnblklk.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_y4NF8jqtRbjEZbTTSLWhaw_KohHngqU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        async function verifyExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }
        verifyExistingSession();

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.innerText = '';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMessage.innerText = error.message;
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
